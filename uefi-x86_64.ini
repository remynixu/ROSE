[binaries]
c = 'clang'
ld = 'lld-link'
strip = 'llvm-strip'

[built-in options]
c_args = ['-target', 'x86_64-unknown-windows', '-mno-red-zone', '-nostdlib', '-fno-builtin', '-ffreestanding']
c_link_args = ['-fuse-ld=lld', '-Wl,/subsystem:efi_application', '-Wl,/entry:efi_bootloader']

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'